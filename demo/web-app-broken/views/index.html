<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MiniShop</title>
    <script src="/app.js"></script>
  </head>
  <body>
    <!-- BUG: image with no alt text (accessibility) -->
    <img src="/logo.png" />
    <h1>MiniShop</h1>

    <!-- BUG: form input with no associated label -->

      <input type="text" name="username" placeholder="username" />
      <input type="password" name="password" />
      <button>Login</button>
    </form>

    <div id="profile"></div>

    <!-- BUG: button with no accessible name -->
    <button onclick="loadProfile()"></button>
  </body>
</html>
