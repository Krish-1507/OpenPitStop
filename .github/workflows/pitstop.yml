name: OpenPitStop CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Only one OpenPitStop run per PR at a time; a newer push cancels the older run so
# we never race two comment updates against each other.
concurrency:
  group: pitstop-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pitstop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build openpitstop
        run: npm run build

      # pitstop ci is diagnostic-only and prints a single markdown block to stdout.
      # This repo dogfoods its own build (node dist/cli.js ci); published consumers
      # run the equivalent `npx openpitstop ci`.
      - name: Run pitstop ci (diagnostic-only, read-only)
        run: node dist/cli.js ci > pitstop-ci.md

      - name: Post / update OpenPitStop CI comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pitstop-ci-report -->';
            let body;
            try {
              body = fs.readFileSync('pitstop-ci.md', 'utf8').trimEnd();
            } catch {
              body = '_OpenPitStop CI produced no report._';
            }
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const full = body + '\n\n---\n' + marker;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body: full,
              });
            }
