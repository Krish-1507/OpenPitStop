name: Release

# Auto-create a GitHub Release whenever a version tag is pushed (e.g. `npm version`
# then `git push --follow-tags`). This keeps the Releases page in sync with the
# published npm versions — previously only the git tag existed, so Releases lagged.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
