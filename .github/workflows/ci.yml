name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Regression suite: patch-validity tests generate diffs and assert real
      # `git apply --check` on clean/BOM'd files (guards the "corrupt patch"
      # bug class) — runs on both OSes because git apply parsing is the point.
      - name: Test (patch validity + unit)
        run: npm test

      # The smoke test is the regression guard for the Windows bugs fixed in
      # 0.1.0/0.1.1: execa-based tool spawning (npm.cmd/.cmd shim resolution)
      # and repo-relative test paths (8.3 short-path jest rootDir mismatch).
      # It also asserts the built CLI actually produced a real scan result, not
      # just that it exited 0 — a crash-mid-scan would otherwise slip through.
      - name: Smoke test (scan demo-repo)
        run: |
          node dist/cli.js scan demo-repo
          node -e "const j=require('./demo-repo/.pitstop/scan-latest.json'); if(!j||!j.security){throw new Error('scan produced no security results');} console.log('smoke OK — scan status:', j.security.status);"
